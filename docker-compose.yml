services:

  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: production_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: wcd_backend
    restart: always

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/production_db

    depends_on:
      - db

    expose:
      - "8000"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: wcd_frontend
    restart: always

    expose:
      - "4200"

    depends_on:
      - backend


  nginx:
    image: nginx:alpine
    container_name: wcd_nginx
    restart: always

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - frontend
      - backend


volumes:
  postgres_data:
