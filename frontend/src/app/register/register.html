<div class="auth-container">

  <div class="auth-card">

    <div class="auth-header">

      <h1>Créer un compte</h1>

      <p>
        Inscrivez-vous pour continuer
      </p>

    </div>


    <form (ngSubmit)="register()">

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="exemple@email.com"
          autocomplete="email"
        />

      </div>


      <div class="form-group">

        <label for="password">
          Mot de passe
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Votre mot de passe"
          autocomplete="new-password"
        />

      </div>


      <div class="form-group">

        <label for="confirmPassword">
          Confirmer le mot de passe
        </label>

        <input
          id="confirmPassword"
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="Confirmez votre mot de passe"
          autocomplete="new-password"
        />

      </div>


      <div
        class="error-message"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </div>


      <div
        class="success-message"
        *ngIf="successMessage"
      >
        {{ successMessage }}
      </div>


      <button
        type="submit"
        [disabled]="loading"
      >

        <span *ngIf="!loading">
          Créer mon compte
        </span>

        <span *ngIf="loading">
          Création...
        </span>

      </button>

    </form>


    <div class="auth-footer">

      <p>
        Vous avez déjà un compte ?
      </p>

      <button
        type="button"
        class="link-button"
        (click)="goToLogin()"
      >
        Se connecter
      </button>

    </div>

  </div>

</div>
