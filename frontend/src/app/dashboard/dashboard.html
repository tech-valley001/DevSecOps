<!-- dashboard.html -->
<div class="dashboard-wrapper">

  <!-- EN-TÊTE SUPERIEUR -->
  <div class="header-top">
    <div class="header-left">
      <a routerLink="/acceuil" class="btn-accueil">← Accueil</a>
      <span *ngIf="filename" class="badge-filename">{{ filename }}</span>
    </div>

    <!-- SÉLECTEUR DE FEUILLE -->
    <div class="header-right" *ngIf="sheets.length > 0">
      <label class="label-sheet">Feuille :</label>
      <select class="select-sheet" (change)="selectSheet($any($event.target).value)">
        <option *ngFor="let s of sheets" [value]="s" [selected]="s === selectedSheet">{{ s }}</option>
      </select>
    </div>
  </div>

  <div class="main-grid">
    
    <!-- MENU LATÉRAL -->
    <div class="sidebar">
      <div class="sidebar-card">
        <h6 class="sidebar-title">📌 Colonnes</h6>

        <div class="list-group">
          <button 
            *ngFor="let cat of columnCategories"
            class="list-group-item"
            [class.active]="selectedCategory === cat"
            (click)="onSelectColumnCategory(cat)">
            <span class="item-label">📊 {{ cat }}</span>
            <span class="item-arrow">→</span>
          </button>
        </div>
      </div>
    </div>

    <!-- ZONE PRINCIPALE -->
    <div class="main-content" *ngIf="selectedCategory">
      
      <!-- KPIS -->
      <div class="section" *ngIf="selectedColumnKPIs.length > 0">
        <h6 class="section-title kpi-title">🎯 KPIs : {{ selectedCategory }}</h6>
        
        <div class="kpi-grid">
          <div class="kpi-card" *ngFor="let kpi of selectedColumnKPIs">
            
            <div class="kpi-header">
              <span class="kpi-name">{{ kpi.subName }}</span>
              <span class="badge" [ngClass]="{
                'badge-success': kpi.status === 'success',
                'badge-warning': kpi.status === 'warning',
                'badge-danger': kpi.status === 'danger',
                'badge-neutral': kpi.status === 'neutral'
              }">{{ kpi.status }}</span>
            </div>

            <div class="kpi-value">
              <h3 class="value-number">
                {{ kpi.value }} 
                <small class="value-unit">{{ kpi.unit }}</small>
              </h3>
            </div>

            <div class="kpi-footer">
              <span [class.text-success]="kpi.trend >= 0" [class.text-danger]="kpi.trend < 0">
                {{ kpi.trend >= 0 ? '▲ +' : '▼ ' }}{{ kpi.trend }}
              </span>
              <span *ngIf="kpi.targetF1 !== null" class="target-f1">
                Cible F1: <strong>{{ kpi.targetF1 }} {{ kpi.unit }}</strong>
              </span>
            </div>

          </div>
        </div>
      </div>

      <!-- GRAPHIQUES ÉVOLUTION -->
      <div class="section" *ngIf="categoryChartOptions.length > 0">
        <h6 class="section-title chart-title">📈 Évolution Temporelle</h6>

        <div class="charts-container">
          <div class="chart-card" *ngFor="let opt of categoryChartOptions">
            <div echarts [options]="opt" style="height: 360px; width: 100%;"></div>
          </div>
        </div>
      </div>

      <!-- GRAPHIQUES OBJECTIFS -->
      <div class="section" *ngIf="objectiveChartOptions.length > 0">
        <h6 class="section-title objective-title">🎯 Comparaison avec les Objectifs F1</h6>

        <div class="charts-container">
          <div class="chart-card" *ngFor="let opt of objectiveChartOptions">
            <div echarts [options]="opt" style="height: 350px; width: 100%;"></div>
          </div>
        </div>
      </div>

    </div>

  </div>

</div>
