<div class="acceuil-container">

  <!-- ZONE D'IMPORTATION -->
  <div class="card-box import-card">
    <h2 class="card-title">📁 Importer un nouveau fichier</h2>
    <div class="import-controls">
      <input 
        type="file" 
        class="file-input" 
        (change)="onFileSelected($event)" 
        accept=".csv, .xlsx, .xls">
      
      <button 
        class="btn btn-primary" 
        [disabled]="!selectedFile || loading" 
        (click)="analyze()">
        <span *ngIf="loading" class="spinner"></span>
        {{ loading ? 'Analyse...' : 'Analyser' }}
      </button>
    </div>
  </div>

  <!-- LISTE DES FICHIERS EN BASE DE DONNÉES -->
  <div class="card-box files-card">
    
    <div class="card-header">
      <h2 class="card-title">📜 Fichiers enregistrés en base de données</h2>

      <div class="action-buttons" *ngIf="recentFiles.length > 0">
        <!-- Bouton Supprimer la sélection -->
        <button 
          class="btn btn-warning" 
          [disabled]="selectedFileIds.length === 0" 
          (click)="deleteSelectedFiles()">
          🗑️ Supprimer la sélection ({{ selectedFileIds.length }})
        </button>

        <!-- Bouton Tout supprimer -->
        <button 
          class="btn btn-danger" 
          (click)="deleteAllFiles()">
          🔥 Tout supprimer
        </button>
      </div>
    </div>

    <!-- AUCUN FICHIER -->
    <div *ngIf="recentFiles.length === 0" class="empty-state">
      Aucun fichier n'est actuellement présent dans la base de données.
    </div>

    <!-- TABLEAU DES FICHIERS -->
    <div *ngIf="recentFiles.length > 0" class="table-wrapper">
      <table class="custom-table">
        <thead>
          <tr>
            <th class="col-checkbox">
              <input 
                type="checkbox" 
                class="custom-checkbox" 
                [(ngModel)]="selectAll" 
                (change)="toggleSelectAll()">
            </th>
            <th>Nom du Fichier</th>
            <th>Feuilles</th>
            <th>Date d'importation</th>
            <th class="text-right">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr 
            *ngFor="let file of recentFiles" 
            class="table-row" 
            (click)="openDashboard(file.id)">
            
            <td class="col-checkbox" (click)="$event.stopPropagation()">
              <input 
                type="checkbox" 
                class="custom-checkbox" 
                [checked]="isFileSelected(file.id)" 
                (change)="toggleFileSelection(file.id)">
            </td>

            <td class="file-name">
              📊 {{ file.filename }}
            </td>

            <td>
              <span class="badge" *ngIf="file.sheets_count">{{ file.sheets_count }} feuille(s)</span>
            </td>

            <td class="file-date">
              {{ file.imported_at | date:'dd/MM/yyyy HH:mm' }}
            </td>

            <td class="text-right" (click)="$event.stopPropagation()">
              <button 
                class="btn-icon" 
                title="Supprimer ce fichier"
                (click)="deleteSingleFile(file.id, $event)">
                🗑️
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

</div>
